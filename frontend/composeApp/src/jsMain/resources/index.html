<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTANAV — Location Discovery &amp; Commerce</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F7F9FC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #app-root {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #compose-root {
            width: 100%;
            height: 100%;
            position: relative;
            box-sizing: border-box;
        }
        #compose-root.with-map {
            width: 340px;
            min-width: 320px;
            max-width: 380px;
            flex-shrink: 0;
        }
        #map-root {
            flex: 1;
            height: 100%;
            display: none;
            position: relative;
            box-sizing: border-box;
        }
        #map-root.visible {
            display: block;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <div id="compose-root">
            <canvas id="ComposeTarget"></canvas>
        </div>
        <div id="map-root">
            <div id="map"></div>
        </div>
    </div>
    <script src="skiko.js"></script>
    <script src="composeApp.js"></script>
</body>
</html>
