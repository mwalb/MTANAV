app = "mtanav-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
  method = "GET"
  path = "/api-docs"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
